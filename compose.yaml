services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dfo
      POSTGRES_USER: dfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - history:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U dfo -d dfo"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: v03/Dockerfile
    environment:
      PGHOST: db
      PGDATABASE: dfo
      PGUSER: dfo
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      DATABASE_URL: ""
      DFO_MODEL: ${DFO_MODEL:-deepseek/deepseek-chat}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./v03/library:/app/v03/library:ro
      - ./v03/supplements:/app/v03/supplements:ro
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/records',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: ./web
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  history:
